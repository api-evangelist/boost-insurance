openapi: 3.2.0
info:
  title: Boost Insurance Claims API
  description: Partial, factual OpenAPI description of the Boost Insurance Policy Admin System (PAS) API.
  termsOfService: https://boostinsurance.com/
  contact:
    name: Boost Insurance Support
    email: help@boostinsurance.io
    url: https://learn.boostinsurance.com/docs
  version: '1.0'
servers:
- url: https://api.insurtech.dev
  description: Boost Platform API base URL referenced in Boost developer documentation.
security:
- boostOAuth: []
tags:
- name: Claims
paths:
  /claims:
    post:
      operationId: createClaim
      tags:
      - Claims
      summary: File a First Notice of Loss (FNOL)
      description: Submit FNOL data tied to a Policy. Boost stores the claim against the relevant Policy and begins adjudication in-house or via a TPA partner, acting as the single source of truth for claim status. Claim updates are delivered back to the partner via webhook.
      responses:
        '200':
          description: A claim (FNOL) was created.
components:
  securitySchemes:
    boostOAuth:
      type: oauth2
      description: OAuth 2.0 Client Credentials grant. Tokens are obtained from the Boost authentication endpoint and presented as a Bearer token.
      flows:
        clientCredentials:
          tokenUrl: https://api.insurtech.dev/auth/oauth2/token
          scopes: {}
