openapi: 3.2.0
info:
  title: Boost Insurance Policies API
  description: Partial, factual OpenAPI description of the Boost Insurance Policy Admin System (PAS) API.
  termsOfService: https://boostinsurance.com/
  contact:
    name: Boost Insurance Support
    email: help@boostinsurance.io
    url: https://learn.boostinsurance.com/docs
  version: '1.0'
servers:
- url: https://api.insurtech.dev
  description: Boost Platform API base URL referenced in Boost developer documentation.
security:
- boostOAuth: []
tags:
- name: Policies
paths:
  /policies:
    post:
      operationId: createPolicy
      tags:
      - Policies
      summary: Bind and issue a policy from a quote
      description: Transition a Quote into a Policy by submitting the Quote ID. Boost generates and delivers the Policy with all Quote data including coverages, dates, and entity information, assuming the Quote meets convertibility requirements.
      responses:
        '200':
          description: A policy was created.
components:
  securitySchemes:
    boostOAuth:
      type: oauth2
      description: OAuth 2.0 Client Credentials grant. Tokens are obtained from the Boost authentication endpoint and presented as a Bearer token.
      flows:
        clientCredentials:
          tokenUrl: https://api.insurtech.dev/auth/oauth2/token
          scopes: {}
